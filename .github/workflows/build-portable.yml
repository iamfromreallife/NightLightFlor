name: Build portable NightLight

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Automation-authored commits may not emit a usable push workflow event.
  # This periodic fallback builds the current main HEAD only if it has not
  # already produced a successful portable build.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  actions: read

jobs:
  check-build:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Determine whether this commit needs a build
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exclude the current in-progress scheduled run by only counting
          # completed successful runs for the exact commit.
          count=$(gh api "repos/$GH_REPO/actions/workflows/build-portable.yml/runs?head_sha=$HEAD_SHA&status=success&per_page=1" --jq '.total_count')
          if [ "$count" -gt 0 ]; then
            echo "Build already succeeded for $HEAD_SHA; skipping."
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  portable-windows-x64:
    needs: check-build
    if: needs.check-build.outputs.required == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Release build
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON

      - name: Build portable executable and tests
        run: cmake --build build --config Release --parallel

      - name: Run native regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test all-user task and boot service registration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/Release/NightLight.exe').Path
          function Invoke-Setup([string]$argument) {
            # NightLight is a Windows GUI executable: '&' does not wait for it.
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$argument exited with Windows error $($process.ExitCode)"
            }
          }
          try {
            Invoke-Setup '--install-all-users-task'
            $task = Get-ScheduledTask -TaskName 'NightLightAllUsers' -ErrorAction Stop
            if ([string]::IsNullOrEmpty($task.Principal.GroupId)) {
              throw 'Task must use an interactive group principal'
            }
            if (-not ($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' })) {
              throw 'Task must use a logon trigger'
            }
            Invoke-Setup '--remove-all-users-task'
            if (Get-ScheduledTask -TaskName 'NightLightAllUsers' -ErrorAction SilentlyContinue) {
              throw 'Task remains after disabling the option'
            }
            Invoke-Setup '--install-service'
            Start-Sleep -Seconds 2
            $service = Get-CimInstance Win32_Service -Filter "Name='NightLightBackground'"
            if (-not $service -or $service.StartMode -ne 'Auto' -or
                $service.State -ne 'Running') {
              throw 'Boot service did not remain running after installation'
            }
            Invoke-Setup '--remove-service'
          } finally {
            Start-Process -FilePath $exe -ArgumentList '--remove-all-users-task' -Wait -PassThru | Out-Null
            Start-Process -FilePath $exe -ArgumentList '--remove-service' -Wait -PassThru | Out-Null
          }

      - name: Prepare standalone EXE
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "build/Release/NightLight.exe" -Destination "NightLight.exe" -Force
          Get-FileHash -LiteralPath "NightLight.exe" -Algorithm SHA256

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: NightLight-Portable-Win64
          path: NightLight.exe
          if-no-files-found: error
          retention-days: 30
